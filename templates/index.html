<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ assistant_name }}</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#0f1419">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419; --panel: #161d26; --panel-edge: #232d3a;
    --text: #e6edf3; --text-dim: #7d8fa0; --amber: #e8a33d; --teal: #4fd1c5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; }
  .console { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; flex: 1; }

  .bars { display: flex; align-items: center; justify-content: center; gap: 4px; height: 60px; margin-bottom: 10px; }
  .bars div { width: 6px; background: var(--amber); border-radius: 3px; height: 8px; transition: height 0.08s ease; }
  .bars.speaking div { background: var(--teal); }

  h1 { font-size: 26px; font-weight: 700; margin: 0 0 2px 0; }
  .status-line { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; min-height: 16px; }

  .log { width: 100%; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 16px; flex: 1; overflow-y: auto; max-height: 42vh; min-height: 160px; }
  .msg { margin-bottom: 14px; line-height: 1.5; font-size: 15px; }
  .msg:last-child { margin-bottom: 0; }
  .msg .who { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .msg.user .who { color: var(--teal); }
  .msg.maddox .who { color: var(--amber); }
  .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }

  .action-btn { display: inline-block; margin-top: 8px; margin-right: 6px; background: var(--panel-edge); color: var(--text); border: none; border-radius: 6px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer; text-decoration: none; }

  .input-row { width: 100%; display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 150px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 15px; padding: 13px 14px; outline: none; }
  input[type=text]:focus { border-color: var(--amber); }
  button { background: var(--amber); color: #1a1408; border: none; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; padding: 0 16px; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  .secondary { background: var(--panel-edge); color: var(--text); }

  .toggles { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .toggle { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); background: none; border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px; }
  .toggle.on { color: var(--teal); border-color: var(--teal); }
</style>
</head>
<body>
  <div class="console">
    <div class="bars" id="bars">
      <div></div><div></div><div></div><div></div><div></div>
    </div>
    <h1>{{ assistant_name }}</h1>
    <div class="status-line" id="status">standing by</div>

    <div class="log" id="log">
      <div class="msg maddox"><span class="who">{{ assistant_name }}</span>Ready. Ask me anything, or try "generate image of..." / "generate video of...".</div>
    </div>

    <div class="input-row">
      <input type="text" id="input" placeholder="Type here, or say 'Hey Maddox'...">
      <button id="askBtn">Ask</button>
      <button class="secondary" id="imgBtn">Image</button>
      <button class="secondary" id="vidBtn">Video</button>
    </div>
    <div class="toggles">
      <button class="toggle on" id="voiceToggle">voice: on</button>
      <button class="toggle" id="wakeToggle">wake word: off</button>
    </div>
  </div>

  <audio id="player" crossorigin="anonymous" style="display:none"></audio>

<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }

const log = document.getElementById('log');
const input = document.getElementById('input');
const askBtn = document.getElementById('askBtn');
const imgBtn = document.getElementById('imgBtn');
const vidBtn = document.getElementById('vidBtn');
const status = document.getElementById('status');
const bars = document.getElementById('bars');
const barEls = bars.querySelectorAll('div');
const player = document.getElementById('player');
const voiceToggle = document.getElementById('voiceToggle');
const wakeToggle = document.getElementById('wakeToggle');

let voiceOn = true;
voiceToggle.onclick = () => {
  voiceOn = !voiceOn;
  voiceToggle.textContent = 'voice: ' + (voiceOn ? 'on' : 'off');
  voiceToggle.classList.toggle('on', voiceOn);
};

function addMsg(who, text, mediaUrl, mediaType, action) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const label = who === 'user' ? 'you' : '{{ assistant_name }}';
  let html = '<span class="who">' + label + '</span>' + (text || '').replace(/</g, '&lt;');
  div.innerHTML = html;
  if (mediaUrl && mediaType === 'image') {
    const img = document.createElement('img');
    img.src = mediaUrl;
    div.appendChild(img);
  }
  if (mediaUrl && mediaType === 'video') {
    const vid = document.createElement('video');
    vid.src = mediaUrl;
    vid.controls = true;
    div.appendChild(vid);
  }
  if (action) {
    if (action.type === 'whatsapp') {
      const a = document.createElement('a');
      const num = action.number ? action.number : '';
      a.href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(action.message);
      a.target = '_blank';
      a.className = 'action-btn';
      a.textContent = '📱 Open in WhatsApp';
      div.appendChild(a);
    }
    if (action.type === 'maps') {
      const a = document.createElement('a');
      a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(action.query);
      a.target = '_blank';
      a.className = 'action-btn';
      a.textContent = '📍 Open in Maps';
      div.appendChild(a);
      if (navigator.share) {
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.textContent = '↗ Share';
        btn.onclick = () => navigator.share({ title: 'Maddox found this', text: action.query, url: a.href });
        div.appendChild(btn);
      }
    }
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  addMsg('user', question);
  setBusy(true);
  status.textContent = 'thinking...';

  try {
    const res = await fetch('/ask', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ question }) });
    const data = await res.json();
    if (data.error) {
      addMsg('maddox', 'Error: ' + data.error);
      status.textContent = 'standing by';
    } else {
      addMsg('maddox', data.answer, null, null, data.action);
      if (voiceOn) { speak(data.answer); } else { status.textContent = 'standing by'; }
    }
  } catch (e) {
    addMsg('maddox', 'Connection error: ' + e.message);
    status.textContent = 'standing by';
  }
  setBusy(false);
}

async function generateImage() {
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = '';
  addMsg('user', 'generate image: ' + prompt);
  setBusy(true);
  status.textContent = 'painting...';
  try {
    const res = await fetch('/generate-image', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ prompt }) });
    const data = await res.json();
    if (data.error) { addMsg('maddox', 'Error: ' + data.error); }
    else { addMsg('maddox', 'Here you go:', data.url, 'image'); }
  } catch (e) { addMsg('maddox', 'Connection error: ' + e.message); }
  status.textContent = 'standing by';
  setBusy(false);
}

async function generateVideo() {
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = '';
  addMsg('user', 'generate video: ' + prompt);
  setBusy(true);
  status.textContent = 'rendering (this can take a while)...';
  try {
    const res = await fetch('/generate-video', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ prompt }) });
    if (!res.ok) {
      const data = await res.json().catch(()=>({error:'Video generation failed.'}));
      addMsg('maddox', 'Error: ' + (data.error || 'Video generation failed.'));
    } else {
      const blob = await res.blob();
      addMsg('maddox', 'Here you go:', URL.createObjectURL(blob), 'video');
    }
  } catch (e) { addMsg('maddox', 'Connection error: ' + e.message); }
  status.textContent = 'standing by';
  setBusy(false);
}

function setBusy(b) { askBtn.disabled = b; imgBtn.disabled = b; vidBtn.disabled = b; }

let audioCtx, analyser, source, rafId;
function setupAnalyser() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(player);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 32;
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function animateBars() {
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const picks = [2, 5, 8, 5, 2];
  barEls.forEach((el, i) => {
    const v = data[picks[i]] || 0;
    el.style.height = Math.max(8, (v / 255) * 56) + 'px';
  });
  rafId = requestAnimationFrame(animateBars);
}

async function speak(text) {
  status.textContent = 'speaking...';
  bars.classList.add('speaking');
  try {
    setupAnalyser();
    const res = await fetch('/speak', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
    const blob = await res.blob();
    player.src = URL.createObjectURL(blob);
    await audioCtx.resume();
    animateBars();
    player.onended = () => {
      cancelAnimationFrame(rafId);
      bars.classList.remove('speaking');
      barEls.forEach(el => el.style.height = '8px');
      status.textContent = 'standing by';
    };
    player.play();
  } catch (e) {
    bars.classList.remove('speaking');
    status.textContent = 'standing by';
  }
}

askBtn.onclick = ask;
imgBtn.onclick = generateImage;
vidBtn.onclick = generateVideo;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });

// ---- Wake word: "Hey Maddox" (works while this tab is open & focused) ----
let recognition = null;
let wakeOn = false;

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { return null; }
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-US';
  r.onresult = (event) => {
    const transcript = Array.from(event.results).map(res => res[0].transcript).join(' ').toLowerCase();
    const idx = transcript.indexOf('maddox');
    if (idx !== -1) {
      const after = transcript.slice(idx + 6).trim();
      if (after.length > 2) {
        input.value = after;
        ask();
      } else {
        status.textContent = 'listening... go ahead';
      }
    }
  };
  r.onerror = () => {};
  r.onend = () => { if (wakeOn) { try { r.start(); } catch(e) {} } };
  return r;
}

wakeToggle.onclick = () => {
  wakeOn = !wakeOn;
  wakeToggle.textContent = 'wake word: ' + (wakeOn ? 'on' : 'off');
  wakeToggle.classList.toggle('on', wakeOn);
  if (wakeOn) {
    if (!recognition) { recognition = setupRecognition(); }
    if (recognition) {
      try { recognition.start(); status.textContent = 'say "Hey Maddox"...'; }
      catch(e) {}
    } else {
      addMsg('maddox', "Your browser doesn't support voice recognition — try Chrome.");
      wakeOn = false;
      wakeToggle.textContent = 'wake word: off';
      wakeToggle.classList.remove('on');
    }
  } else {
    if (recognition) { recognition.onend = null; recognition.stop(); }
    status.textContent = 'standing by';
  }
};
</script>
</body>
</html>
