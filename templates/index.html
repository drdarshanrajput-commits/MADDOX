<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ assistant_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --panel: #161d26;
    --panel-edge: #232d3a;
    --text: #e6edf3;
    --text-dim: #7d8fa0;
    --amber: #e8a33d;
    --teal: #4fd1c5;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    min-height: 100vh;
  }

  .console {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .orb-wrap {
    position: relative;
    width: 140px;
    height: 140px;
    margin-bottom: 18px;
  }
  .orb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd98a, var(--amber) 45%, #a5661c 100%);
    box-shadow: 0 0 0 1px var(--panel-edge), 0 0 40px rgba(232,163,61,0.25);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }
  .orb.thinking {
    animation: pulse 1.1s ease-in-out infinite;
  }
  .orb.speaking {
    box-shadow: 0 0 0 1px var(--panel-edge), 0 0 55px rgba(79,209,197,0.45);
    background: radial-gradient(circle at 35% 30%, #baf5ee, var(--teal) 45%, #1f6b63 100%);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 2px 0;
    letter-spacing: 0.5px;
  }
  .status-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
    min-height: 16px;
  }

  .log {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 18px;
    flex: 1;
    overflow-y: auto;
    max-height: 48vh;
    min-height: 180px;
  }
  .msg {
    margin-bottom: 16px;
    line-height: 1.5;
    font-size: 15px;
  }
  .msg:last-child { margin-bottom: 0; }
  .msg .who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 3px;
  }
  .msg.user .who { color: var(--teal); }
  .msg.maddox .who { color: var(--amber); }

  .input-row {
    width: 100%;
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  input[type=text] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    outline: none;
  }
  input[type=text]:focus {
    border-color: var(--amber);
  }
  button {
    background: var(--amber);
    color: #1a1408;
    border: none;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 0 22px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .toggle {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .toggle.on { color: var(--teal); border-color: var(--teal); }
</style>
</head>
<body>
  <div class="console">
    <div class="orb-wrap"><div class="orb" id="orb"></div></div>
    <h1>{{ assistant_name }}</h1>
    <div class="status-line" id="status">standing by</div>

    <div class="log" id="log">
      <div class="msg maddox"><span class="who">{{ assistant_name }}</span>Ready when you are. Ask me anything.</div>
    </div>

    <div class="input-row">
      <input type="text" id="input" placeholder="Type your question..." autofocus>
      <button id="askBtn">Ask</button>
    </div>
    <button class="toggle on" id="voiceToggle">voice: on</button>
  </div>

  <audio id="player" style="display:none"></audio>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const askBtn = document.getElementById('askBtn');
const status = document.getElementById('status');
const orb = document.getElementById('orb');
const player = document.getElementById('player');
const voiceToggle = document.getElementById('voiceToggle');

let voiceOn = true;
voiceToggle.onclick = () => {
  voiceOn = !voiceOn;
  voiceToggle.textContent = 'voice: ' + (voiceOn ? 'on' : 'off');
  voiceToggle.classList.toggle('on', voiceOn);
};

function addMsg(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const label = who === 'user' ? 'you' : '{{ assistant_name }}';
  div.innerHTML = '<span class="who">' + label + '</span>' + text.replace(/</g, '&lt;');
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  addMsg('user', question);
  askBtn.disabled = true;
  status.textContent = 'thinking...';
  orb.classList.add('thinking');

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    orb.classList.remove('thinking');

    if (data.error) {
      addMsg('maddox', 'Error: ' + data.error);
      status.textContent = 'standing by';
    } else {
      addMsg('maddox', data.answer);
      if (voiceOn) {
        speak(data.answer);
      } else {
        status.textContent = 'standing by';
      }
    }
  } catch (e) {
    orb.classList.remove('thinking');
    addMsg('maddox', 'Connection error: ' + e.message);
    status.textContent = 'standing by';
  }
  askBtn.disabled = false;
}

async function speak(text) {
  status.textContent = 'speaking...';
  orb.classList.add('speaking');
  try {
    const res = await fetch('/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const blob = await res.blob();
    player.src = URL.createObjectURL(blob);
    player.onended = () => {
      orb.classList.remove('speaking');
      status.textContent = 'standing by';
    };
    player.play();
  } catch (e) {
    orb.classList.remove('speaking');
    status.textContent = 'standing by';
  }
}

askBtn.onclick = ask;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
